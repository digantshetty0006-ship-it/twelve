<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Digant Shetty — profile 2026</title>
  <desc id="desc">Editorial profile card: Digant Shetty, third-year IT student, full-stack developer and AI/ML builder based in Navi Mumbai. A year dial marks day 326 of 2026.</desc>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#17150F" opacity="0.07"/>
    </pattern>
    <style>
      .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", "Liberation Serif", serif; }
      .meta { font-size: 10.5px; letter-spacing: 1.7px; fill: #5C564A; }
      .month { font-size: 10px; letter-spacing: 1px; fill: #6B6457; }
      .hair { stroke: #17150F; stroke-width: 1; opacity: .22; }
    </style>
  </defs>

  <rect width="1200" height="480" fill="#F2EDE3"/>
  <rect width="1200" height="480" fill="url(#dots)"/>

  <!-- top rule -->
  <text x="48" y="46" class="mono meta">DIGANT SHETTY / PROFILE 2026</text>
  <text x="1152" y="46" text-anchor="end" class="mono meta">NAVI MUMBAI, IN · 19.03°N 73.02°E</text>
  <line x1="48" y1="62" x2="1152" y2="62" class="hair"/>

  <!-- name -->
  <text x="44" y="202" class="serif" font-size="160" letter-spacing="-5" fill="#17150F">Digant</text>
  <text x="44" y="346" class="serif" font-size="160" letter-spacing="-5" font-style="italic" fill="#17150F">Shetty<tspan fill="#B23A1F" font-style="normal">.</tspan></text>

  <!-- role and line -->
  <text x="48" y="402" class="sans" font-size="18" font-weight="600" fill="#17150F">Third-year B.Tech IT  ·  Full-stack developer  ·  AI/ML</text>
  <text x="48" y="430" class="serif" font-size="18" font-style="italic" fill="#5C564A">Careful software for money, food, and public systems.</text>

  <!-- year dial -->
  <g>
    <circle cx="958" cy="238" r="100" fill="none" stroke="#17150F" opacity="0.28"/>
    <circle cx="958" cy="238" r="116" fill="none" stroke="#17150F" opacity="0.10"/>

    <!-- 12 ticks: r=94 to r=107 -->
    <g stroke="#17150F" stroke-width="1" opacity="0.38">
      <line x1="958" y1="144" x2="958" y2="131"/>
      <line x1="1009" y1="153.4" x2="1015.4" y2="142.3"/>
      <line x1="1051.6" y1="183.9" x2="1061.2" y2="177.4"/>
      <line x1="1064" y1="238" x2="1077" y2="238"/>
      <line x1="1051.6" y1="292.1" x2="1061.2" y2="298.6"/>
      <line x1="1009" y1="322.6" x2="1015.4" y2="333.7"/>
      <line x1="958" y1="332" x2="958" y2="345"/>
      <line x1="907" y1="322.6" x2="900.6" y2="333.7"/>
      <line x1="864.4" y1="292.1" x2="854.8" y2="298.6"/>
      <line x1="852" y1="238" x2="839" y2="238"/>
      <line x1="864.4" y1="183.9" x2="854.8" y2="177.4"/>
      <line x1="907" y1="153.4" x2="900.6" y2="142.3"/>
    </g>

    <!-- month labels: r=134 -->
    <g class="mono month" text-anchor="middle">
      <text x="958" y="100" fill="#B23A1F" font-weight="700">JAN</text>
      <text x="1025" y="118">FEB</text>
      <text x="1074" y="168">MAR</text>
      <text x="1092" y="241.5">APR</text>
      <text x="1074" y="306">MAY</text>
      <text x="1025" y="358">JUN</text>
      <text x="958" y="376">JUL</text>
      <text x="891" y="358">AUG</text>
      <text x="842" y="306">SEP</text>
      <text x="824" y="241.5">OCT</text>
      <text x="842" y="168" fill="#B23A1F" font-weight="700">NOV</text>
      <text x="891" y="118">DEC</text>
    </g>

    <!-- progress: 323 of 365 days -->
    <path d="M 958 138 A 100 100 0 1 1 895.9 159.7" fill="none" stroke="#B23A1F" stroke-width="2.4" stroke-linecap="round" opacity="0.92"/>

    <!-- hand at November -->
    <line x1="958" y1="238" x2="895.9" y2="159.7" stroke="#17150F" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="895.9" cy="159.7" r="3.2" fill="#B23A1F"/>

    <!-- center disc -->
    <circle cx="958" cy="238" r="43" fill="#F2EDE3" stroke="#17150F" opacity="0.95"/>
    <circle cx="958" cy="238" r="43" fill="none" stroke="#17150F" opacity="0.18"/>
  </g>

  <text x="958" y="242" text-anchor="middle" class="serif" font-size="30" fill="#17150F">2026</text>
  <text x="958" y="258" text-anchor="middle" class="mono" font-size="7.5" letter-spacing="1" fill="#5C564A">NOV · DAY 326</text>

  <!-- footer -->
  <text x="48" y="464" class="mono" font-size="8.5" letter-spacing="1.4" fill="#8D8576">SET IN GEORGIA &amp; SYSTEM MONO</text>
  <text x="1152" y="464" text-anchor="end" class="mono" font-size="8.5" letter-spacing="1.4" fill="#8D8576">ONE YEAR, KEPT</text>
</svg>
